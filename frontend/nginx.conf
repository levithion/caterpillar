server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location /ready {
        proxy_pass http://backend:8000/ready;
    }
}
